name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Package APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk \
            "dist/HarleyDroidEVO-${GITHUB_REF_NAME}-debug.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
          body: |
            ## HarleyDroid EVO ${{ github.ref_name }}

            APK prêt à installer (sideload). Sur Android : autoriser l’installation depuis des sources inconnues / le navigateur, puis ouvrir le fichier.

            ### Highlights

            - UI Material 3 : thème sombre, branding, status pills, cartes diagnostics
            - Jauges modernisées (cadrans + LCD) et barres verticales FUEL / TEMP
            - Self-test cluster à la connexion + mode simulation (`SIM`)
            - Thèmes de couleur et choix de langue (EN / FR)
            - Bus dual J1850 (4 pins) + CAN / HDLAN (6 pins, télémétrie passive)
            - Captures : voir [README.md](https://github.com/QuickosssLabs/HarleyDroidEVO/blob/main/README.md#screenshots)

            ### Build

            - Licence : GPL-3.0 (voir `COPYING`)
            - Build : `assembleDebug` (clé de signature debug — usage communautaire / test)
            - Sources et notes : `README.md`, `BUILD.md`, `RELEASE_NOTES.md`

            Dérivé de [stelian42/HarleyDroid](https://github.com/stelian42/HarleyDroid).
